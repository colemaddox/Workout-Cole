  function coreChips(list, selected){
    var wrap = document.createElement("div");
    wrap.className = "core-grid";
    list.forEach(function(name){
      var b = document.createElement("button");
      b.className = "chip";
      b.type = "button";
      b.textContent = name;
      b.dataset.name = name;
      var on = selected && selected.indexOf(name) !== -1;
      if (on) b.classList.add("on");
      b.setAttribute("aria-pressed", on ? "true" : "false");
      b.addEventListener("click", function(){
        var now = b.classList.toggle("on");
        b.setAttribute("aria-pressed", now ? "true" : "false");
      });
      wrap.appendChild(b);
    });
    return wrap;
  }

  function checklist(list, selected){
    var wrap = document.createElement("div");
    wrap.className = "checklist";
    list.forEach(function(item, i){
      var row = document.createElement("button");
      row.className = "check-row";
      row.type = "button";
      row.dataset.idx = i;
      row.dataset.name = item.name;
      row.innerHTML = '<span class="cbox"></span><span class="ctext"><span class="cname">'+esc(item.name)+'</span><span class="cdet">'+esc(item.d)+'</span></span>';
      var on = selected && selected.indexOf(item.name) !== -1;
      if (on) row.classList.add("on");
      row.setAttribute("aria-pressed", on ? "true" : "false");
      row.addEventListener("click", function(){
        var now = row.classList.toggle("on");
        row.setAttribute("aria-pressed", now ? "true" : "false");
      });
      wrap.appendChild(row);
    });
    return wrap;
  }

  function sectionLabel(txt){
    var d = document.createElement("div");
    d.className = "flabel";
    d.style.marginTop = "26px";
    d.textContent = txt;
    return d;
  }

  // ----- Render the form for a chosen type (optionally prefilled) -----
  // session: a saved session (edit mode) or a draft (restore). isEdit: true => update-in-place mode.
  function buildForm(type, session, isEdit){
    currentType = type;
    editing = isEdit ? session : null;
    // a resumed draft owns the slot from the start; fresh and edit forms don't
    // own it until their own autosave writes it
    draftOwned = !!session && !isEdit;
    fuelSugs = []; // chip registry rebuilds with the form
    var area = $("form-area");
    area.innerHTML = "";
    var isDay = (type === "Day");
    var dayBlocks = isDay ? ((session && session.blocks) ? session.blocks.slice() : selBlocks.slice()) : [];
    dayBlocks.sort();
    activeBlocks = dayBlocks;
    var conf = isDay ? null : PROGRAM[type];
    // when amending, "last time" means the session BEFORE this one, never a later one
    var exT = editing ? editing._t : null;
    var exD = editing ? editing.date : null;

    if (editing){
      var bn = document.createElement("div");
      bn.className = "edit-banner";
      var ebBlocks = (editing.type === "Day" && editing.blocks && editing.blocks.length)
        ? ' &middot; Blocks ' + editing.blocks.join("+") : '';
      bn.innerHTML =
        '<div class="eb-text"><div class="eb-eyebrow">Amending the record</div>' +
        '<div class="eb-date">Editing session from ' + fmtDate(editing.date) + ebBlocks + '</div></div>' +
        '<button type="button" class="del" id="edit-cancel">Cancel</button>';
      area.appendChild(bn);
      bn.querySelector("#edit-cancel").addEventListener("click", cancelEdit);
    }

    if (!editing){
      // every non-edit form gets a strip with a way back to the picker —
      // without it a Free form (or resumed legacy draft) would have no exit
      var strip = document.createElement("div");
      strip.className = "day-strip";
      var chgLabel = isDay ? "Change" : "Back";
      var stripLabel = isDay
        ? ('Today: <b>' + (dayBlocks.length ? 'Block ' + dayBlocks.join(' + Block ') : 'no blocks') + '</b>' +
           '<span>&asymp; ' + estOf(dayBlocks) + ' min</span>')
        : ('Today: <b>' + (type === "Free" ? "Free session" : "Session " + esc(type)) + '</b>');
      strip.innerHTML = stripLabel + '<button type="button" class="chg">' + chgLabel + '</button>';
      area.appendChild(strip);
      var chgBtn = strip.querySelector(".chg");
      chgBtn.addEventListener("click", function(){
        if (formHasEntries() && !chgBtn.classList.contains("armed")){
          chgBtn.classList.add("armed");
          chgBtn.textContent = "Tap again — entries will be discarded";
          setTimeout(function(){ chgBtn.classList.remove("armed"); chgBtn.textContent = chgLabel; }, 3000);
          return;
        }
        // confirmed: tear the form down and return to the picker, selection kept.
        // only clear the draft slot if THIS form wrote it — an untouched form
        // must not destroy an older stored draft behind the resume card
        stopRest();
        if (draftOwned) clearDraft();
        else { clearTimeout(draftTimer); draftTimer = null; }
        currentType = null; editing = null; activeBlocks = [];
        $("form-area").innerHTML = "";
        $("savebar").style.display = "none";
        renderPicker();
        renderPrompt();
      });
    }

    area.appendChild(sectionLabel("Warm-Up"));
    var wuList = PROGRAM.warmup.slice();
    if (session && session.warmup){
      session.warmup.forEach(function(n){
        if (!wuList.some(function(it){ return it.name === n; })) wuList.push({ name:n, d:"from this session" });
      });
    }
    var wu = checklist(wuList, session ? session.warmup : null);
    wu.id = "warmup-wrap";
    area.appendChild(wu);

    if (type === "A" || isDay){
      var knee = document.createElement("button");
      knee.className = "check-row knee-row"; knee.type = "button"; knee.id = "knee-toggle";
      knee.innerHTML = '<span class="cbox"></span><span class="ctext"><span class="cname">Knee discomfort today?</span><span class="cdet">Tap if your knees are bothering you</span></span>';
      area.appendChild(knee);
      var ka = document.createElement("div"); ka.className = "ex-alert"; ka.id = "knee-alert"; ka.style.display = "none";
      ka.setAttribute("role","status");
      ka.innerHTML = '<b>Go easy on the knees.</b> Lighten or skip the Leg Press and the Goblet Squat, shorten the range, and lean on hinges and leg curls instead. Keep every movement pain-free.';
      area.appendChild(ka);
      var kneeOn = !!(session && session.knee);
      if (kneeOn){ knee.classList.add("on"); ka.style.display = "block"; }
      knee.setAttribute("aria-pressed", kneeOn ? "true" : "false");
      knee.addEventListener("click", function(){
        var on = knee.classList.toggle("on");
        knee.setAttribute("aria-pressed", on ? "true" : "false");
        ka.style.display = on ? "block" : "none";
      });
    }

    // Low-fuel flag — on EVERY form (5 AM sessions can be Free days too, and a
    // session can be retro-flagged in edit mode). GLP-1 rule: cap RPE 6, drop
    // the cardio, keep strength light; the flag also shields progression.
    var fuel = document.createElement("button");
    fuel.className = "check-row fuel-row"; fuel.type = "button"; fuel.id = "fuel-toggle";
    fuel.innerHTML = '<span class="cbox"></span><span class="ctext"><span class="cname">Low fuel today?</span><span class="cdet">Running on empty &mdash; capped effort, easy on cardio</span></span>';
    area.appendChild(fuel);
    var fal = document.createElement("div"); fal.className = "ex-alert"; fal.id = "fuel-alert"; fal.style.display = "none";
    fal.setAttribute("role","status");
    var fuelMsg = '<b>Running on fumes &mdash; cap it at RPE 6.</b> Same lifts, a notch lighter, crisp reps. Protein when you get home.';
    var hasCardioBlk = isDay && dayBlocks.some(function(b){
      var blk = PROGRAM.blocks[b];
      return blk && blk.kind === "Cardio";
    });
    if (hasCardioBlk) fuelMsg += ' Cardio is in today\'s stack &mdash; skip it or cap it at an easy 10-minute walk.';
    fal.innerHTML = fuelMsg;
    area.appendChild(fal);
    var fuelOn = !!(session && session.fuel);
    if (fuelOn){ fuel.classList.add("on"); fal.style.display = "block"; }
    fuel.setAttribute("aria-pressed", fuelOn ? "true" : "false");
    fuel.addEventListener("click", function(){
      var on = fuel.classList.toggle("on");
      fuel.setAttribute("aria-pressed", on ? "true" : "false");
      fal.style.display = on ? "block" : "none";
      applyFuel(on);
    });

    var savedStr = (session && session.strength) ? session.strength : [];
    // strength renders as groups: legacy types get one unlabeled group,
    // a Day gets one labeled group per selected strength/hybrid block
    var groups = [];
    if (isDay){
      dayBlocks.forEach(function(bid){
        var blk = PROGRAM.blocks[bid];
        if (blk && blk.strength && blk.strength.length){
          groups.push({ label: "Block " + bid + " — " + blk.name, note: blk.note || null, exercises: blk.strength });
        }
      });
    } else if (conf.strength.length){
      groups.push({ label: null, note: null, exercises: conf.strength });
    }
    if (groups.length || type === "Free" || savedStr.length){
      area.appendChild(sectionLabel("Strength"));
      var strengthWrap = document.createElement("div");
      strengthWrap.id = "strength-wrap";
      // consume saved entries by index so duplicate names survive an edit round-trip
      var consumed = savedStr.map(function(){ return false; });
      function takeSaved(name){
        for (var i=0;i<savedStr.length;i++){
          if (!consumed[i] && savedStr[i].name === name){ consumed[i] = true; return savedStr[i]; }
        }
        return null;
      }
      groups.forEach(function(g){
        if (g.label){
          var gl = document.createElement("div");
          gl.className = "blk-label";
          gl.textContent = g.label;
          strengthWrap.appendChild(gl);
        }
        if (g.note){
          var gn = document.createElement("div");
          gn.className = "ex-cue";
          gn.textContent = g.note;
          strengthWrap.appendChild(gn);
        }
        g.exercises.forEach(function(ex){
          // "last time" = the most recent session CONTAINING this exercise,
          // whatever its type — Cycle 01 history flows straight into the blocks.
          // Fresh forms display the last SOLID session (progression reads
          // through low-fuel days); edits keep showing the true previous one.
          var pf = progressionFor(ex, exT, exD);
          var display = editing ? pf.lastFor : (pf.qual || pf.lastFor);
          var le = lastExercise(display, ex.name);
          var qe = lastExercise(pf.qual, ex.name);
          var lastLabel = null;
          if (!editing && pf.lastFor && pf.lastFor.fuel){
            lastLabel = pf.qual ? "Last solid session" : "Last time (low fuel)";
          }
          var saved = takeSaved(ex.name);
          var sg = (!session) ? pf.sg : null;
          strengthWrap.appendChild(exerciseCard({
            name: ex.name, sets: ex.sets, reps: ex.reps, cue: ex.cue, unit: ex.unit, prog: ex.prog,
            suggest: sg,
            hit: !isEdit && !sg && hitTarget(ex.top, qe ? qe.sets : null, ex.sets),
            lastSets: le ? le.sets : null,
            lastLabel: lastLabel,
            values: saved ? saved.sets : null
          }));
        });
      });
      // everything saved on this session that the program cards didn't consume
      savedStr.forEach(function(ex, i){
        if (!consumed[i]){
          strengthWrap.appendChild(exerciseCard({
            name: ex.name, sets: ex.sets.length, values: ex.sets,
            unit: unitForName(ex.name) // yds/sec entries keep their column labels
          }));
        }
      });
      area.appendChild(strengthWrap);

      var addEx = document.createElement("button");
      addEx.type = "button";
      addEx.className = "add-ex";
      addEx.textContent = "+ Add an exercise";
      addEx.addEventListener("click", function(){
        strengthWrap.appendChild(exerciseCard({ sets:3 }));
      });
      area.appendChild(addEx);
    }

    area.appendChild(sectionLabel("Cardio"));
    var cardioBlockCount = 0;
    if (isDay){
      dayBlocks.forEach(function(bid){
        var blk = PROGRAM.blocks[bid];
        if (blk && blk.cardio){
          cardioBlockCount++;
          if (blk.note){
            var cn = document.createElement("div");
            cn.className = "ex-cue";
            cn.textContent = "Block " + bid + " — " + blk.name + ": " + blk.note;
            area.appendChild(cn);
          }
        }
      });
    }
    var cardioWrap = document.createElement("div");
    cardioWrap.id = "cardio-wrap";
    if (session && session.cardio && session.cardio.length){
      session.cardio.forEach(function(c){ cardioWrap.appendChild(cardioCard(c)); });
    } else {
      var nCards = Math.max(1, cardioBlockCount);
      for (var ci = 0; ci < nCards; ci++) cardioWrap.appendChild(cardioCard());
    }
    area.appendChild(cardioWrap);
    var addC = document.createElement("button");
    addC.type = "button";
    addC.className = "add-ex";
    addC.textContent = "+ Add cardio";
    addC.addEventListener("click", function(){ cardioWrap.appendChild(cardioCard()); });
    area.appendChild(addC);

    area.appendChild(sectionLabel("Core & Mobility"));
    var coreBase = [];
    if (isDay){
      // one dose of core per day: Block 7's stability work replaces Block 4's circuit
      var has7 = dayBlocks.indexOf("7") !== -1;
      dayBlocks.forEach(function(bid){
        if (has7 && bid === "4") return;
        var blk = PROGRAM.blocks[bid];
        ((blk && blk.core) || []).forEach(function(c){ if (coreBase.indexOf(c) === -1) coreBase.push(c); });
      });
    } else if (conf.core && conf.core.length){
      coreBase = conf.core.slice();
    }
    var coreList = coreBase.length ? coreBase : ["Plank","Dead Bug","Glute Bridges","Bird-Dogs"];
    if (session && session.core){
      session.core.forEach(function(n){ if (coreList.indexOf(n) === -1) coreList.push(n); });
    }
    var coreEl = coreChips(coreList, session ? session.core : null);
    coreEl.id = "core-wrap";
    area.appendChild(coreEl);

    area.appendChild(sectionLabel("Cool-Down"));
    var cdList = PROGRAM.cooldown.slice();
    if (session && session.cooldown){
      session.cooldown.forEach(function(n){
        if (!cdList.some(function(it){ return it.name === n; })) cdList.push({ name:n, d:"from this session" });
      });
    }
    var cd = checklist(cdList, session ? session.cooldown : null);
    cd.id = "cooldown-wrap";
    area.appendChild(cd);

    var er = document.createElement("div");
    er.className = "effort-row";
    er.innerHTML = '<div class="flabel" style="margin:0;">Effort</div>' +
      '<select id="in-rpe" style="flex:1;" aria-label="Effort">' +
        '<option value="">How did it feel</option>' +
        '<option>2 - Very easy</option>' +
        '<option>3 - Easy</option>' +
        '<option>4 - Comfortable</option>' +
        '<option>5 - Moderate</option>' +
        '<option>6 - Working</option>' +
        '<option>7 - Hard</option>' +
        '<option>8 - Very hard</option>' +
      '</select>';
    area.appendChild(er);
    // honesty nudge, never a blocker: RPE 7+ while the low-fuel flag is on
    $("in-rpe").addEventListener("change", function(){
      var ft = $("fuel-toggle");
      if (!ft || !ft.classList.contains("on")) return;
      var v = parseInt(this.value, 10);
      if (!isNaN(v) && v >= 7) toast("Above the low-fuel cap — log it honestly, but RPE 6 is the ceiling on empty");
    });

    area.appendChild(sectionLabel("Notes"));
    var nt = document.createElement("textarea");
    nt.id = "in-notes";
    nt.placeholder = "Knees felt good. Audiobook: chapter 7. Bumped the leg press 5 lbs.";
    area.appendChild(nt);

    if (session){
      if (session.rpe){
        var rpeSel = $("in-rpe");
        rpeSel.value = session.rpe;
        if (rpeSel.value !== session.rpe){
          var ro = document.createElement("option");
          ro.textContent = session.rpe;
          rpeSel.appendChild(ro);
          rpeSel.value = session.rpe;
        }
      }
      nt.value = session.notes || "";
      $("in-date").value = session.date;
    }

    $("save-btn").textContent = editing ? "Update Session" : "Save Session";
    $("save-hint").textContent = editing ? "Changes replace the original entry." : "Draft saves as you type. Your numbers wait for you here.";
    $("savebar").style.display = "block";
    renderPrompt();
    renderPicker();
  }

  function startEdit(s){
    stopRest();
    switchView("log");
    var type = s.type === "Day" ? "Day" : (PROGRAM[s.type] ? s.type : "Free");
    buildForm(type, s, true);
    window.scrollTo(0,0);
  }

  function cancelEdit(){
    stopRest();
    editing = null;
    currentType = null;
    activeBlocks = [];
    $("form-area").innerHTML = "";
    // reset the date BEFORE rendering — the picker's suggestions read #in-date,
    // and the edited session's date would suppress (or mis-week) them
    $("in-date").value = todayISO();
    renderPicker();
    $("savebar").style.display = "none";
    $("save-btn").textContent = "Save Session";
    $("save-hint").textContent = "Draft saves as you type. Your numbers wait for you here.";
    renderPrompt();
    toast("Edit cancelled");
  }

  // ----- Gather + save -----
  // Flag knee discomfort from notes only when a sentence mentions the knee with a
  // word-bounded discomfort term and no negation ("no knee pain" must not flag).
  function kneeMentioned(notes){
    if (!notes) return false;
    var parts = notes.split(/[.!?\n]+/);
    for (var i=0;i<parts.length;i++){
      var p = parts[i];
      if (!/knee/i.test(p)) continue;
      if (!/\b(pain|painful|hurt|hurts|hurting|sore|soreness|ache|ached|aches|aching|achy|bother|bothered|bothering|bothers|tweak|tweaked|swollen|swelling|discomfort)\b/i.test(p)) continue;
      if (/\b(no|not|zero|without|never|didn't|didnt|don't|dont|wasn't|wasnt|isn't|isnt)\b|pain-free|painfree/i.test(p)) continue;
      return true;
    }
    return false;
  }

  function gather(){
    var strength = [];
    var sw = $("strength-wrap");
    if (sw){
      Array.prototype.forEach.call(sw.querySelectorAll(".ex-card"), function(card){
        var name = card.querySelector(".ex-name").value.trim();
        var sets = [];
        Array.prototype.forEach.call(card.querySelectorAll(".set-row"), function(row){
          var w = row.querySelector(".w").value.trim();
          var r = row.querySelector(".r").value.trim();
          if (w !== "" || r !== ""){
            sets.push({ weight: w===""?null:+w, reps: r===""?null:+r });
          }
        });
        if (name && sets.length) strength.push({ name:name, sets:sets });
      });
    }

    var cardio = [];
    var cw = $("cardio-wrap");
    if (cw){
      Array.prototype.forEach.call(cw.querySelectorAll(".cardio-card"), function(card){
        var act = card.querySelector(".c-act").value;
        var min = card.querySelector(".c-min").value.trim();
        var lvl = card.querySelector(".c-lvl").value.trim();
        var dist = card.querySelector(".c-dist").value.trim();
        // prefilled (edited/restored) cards are kept even if activity-only,
        // so an edit round-trip doesn't drop them; untouched blank cards are not
        if (min !== "" || dist !== "" || lvl !== "" || card.dataset.prefilled){
          cardio.push({ act:act, min: min===""?null:+min, lvl:lvl, dist:dist });
        }
      });
    }

    var core = [];
    var core_w = $("core-wrap");
    if (core_w){
      Array.prototype.forEach.call(core_w.querySelectorAll(".chip.on"), function(c){
        core.push(c.dataset.name);
      });
    }

    var warmup = [];
    var wuw = $("warmup-wrap");
    if (wuw){ Array.prototype.forEach.call(wuw.querySelectorAll(".check-row.on"), function(r){ warmup.push(r.dataset.name); }); }

    var cooldown = [];
    var cdw = $("cooldown-wrap");
    if (cdw){ Array.prototype.forEach.call(cdw.querySelectorAll(".check-row.on"), function(r){ cooldown.push(r.dataset.name); }); }

    var rpeEl = $("in-rpe");
    var notesEl = $("in-notes");
    var notes = notesEl ? notesEl.value.trim() : "";

    // Knee flag: the explicit toggle is authoritative on Session A.
    // On B/Free (no toggle): keep an edited session's existing flag, else
    // only clear discomfort phrasing in the notes sets it.
    var kneeEl = $("knee-toggle");
    var knee = kneeEl ? kneeEl.classList.contains("on")
      : ((editing ? !!editing.knee : false) || kneeMentioned(notes));

    // Low-fuel flag: the toggle is on every form and is authoritative; if it
    // were ever absent, an edited session keeps its stored flag. No notes-mining
    // — "fasted"/"no breakfast" phrasing is too ambiguous to infer from.
    var fuelEl = $("fuel-toggle");
    var fuel = fuelEl ? fuelEl.classList.contains("on") : (editing ? !!editing.fuel : false);

    var s = {
      type: currentType,
      date: $("in-date").value,
      _t: (editing && editing._t) ? editing._t : freshT(),
      warmup: warmup,
      strength: strength,
      cardio: cardio,
      core: core,
      cooldown: cooldown,
      rpe: rpeEl ? rpeEl.value : "",
      knee: knee,
      fuel: fuel,
      notes: notes
    };
    if (currentType === "Day") s.blocks = activeBlocks.slice();
    if (editing) s._edited = Date.now();
    return s;
  }

  function hasContent(s){
    return !!(s.strength.length || s.cardio.length || s.core.length || s.notes ||
           (s.warmup && s.warmup.length) || (s.cooldown && s.cooldown.length));
  }

  function formHasEntries(){
    if (!currentType) return false;
    try { return hasContent(gather()); } catch(e){ return false; }
  }

  function saveSession(){
    var s = gather();
    if (!s.date){ toast("Pick a date first"); return; }
    if (!hasContent(s)){
      toast(editing ? "Nothing left to save — use Delete in History to remove this session" : "Log at least one set or cardio entry");
      return;
    }
    var wasEdit = !!editing;
    if (editing){
      // a change-nothing Update must not stamp a fresh _edited — it would win
      // import conflict resolution over a REAL edit made on another device
      if (contentKey(s) === contentKey(editing)){
        if (editing._edited) s._edited = editing._edited; else delete s._edited;
      }
      var i = LOG.indexOf(editing);
      if (i > -1) LOG[i] = s; else LOG.push(s);
    } else {
      LOG.push(s);
    }
    var ok = Store.save(LOG);
    // clear the draft only when (a) this wasn't an edit, (b) the save actually
    // persisted, and (c) the slot holds THIS form's draft — never a stranger's
    if (!wasEdit && ok && draftOwned) clearDraft();
    stopRest();

    var msg;
    if (!ok){
      msg = "Saved for this visit only — export a backup before closing";
    } else if (wasEdit){
      msg = "Session updated";
    } else {
      msg = "Session logged";
      var w = weekOf(s.date);
      if (w >= 0 && w <= 3){
        var label = (w === weekOf(todayISO())) ? "this week" : "that week";
        msg += " — " + buildCycleCounts().weeks[w].total + " of " + CYCLE.weeklyGoal + " " + label;
      }
      // strength-mandate credit at the moment of the rep (current week only)
      var sowS = isoOf(startOfWeek(parseISO(s.date)));
      if (sowS === isoOf(startOfWeek(new Date()))){
        var wt = weekTally(sowS);
        msg += " · lift " + wt.liftDays + " of " + WK_LIFT_MIN + (wt.liftDays >= WK_LIFT_MIN ? " ✓" : "");
      }
    }
    toast(msg);

    editing = null;
    currentType = null;
    selBlocks = [];
    activeBlocks = [];
    $("form-area").innerHTML = "";
    $("savebar").style.display = "none";
    $("save-btn").textContent = "Save Session";
    $("save-hint").textContent = "Draft saves as you type. Your numbers wait for you here.";
    $("in-date").value = todayISO();
    renderPicker();
    renderHistory();
    switchView("hist");
  }

  // ----- Block picker (Cycle 02): stack blocks to build today's session -----
  function conflictWith(bid){
    var c = (PROGRAM.blocks[bid] && PROGRAM.blocks[bid].conflicts) || [];
    for (var i=0;i<c.length;i++){
      if (selBlocks.indexOf(c[i]) !== -1) return c[i];
    }
    return null;
  }
  // ----- Week ledger bar: the strength mandate at a glance -----
  function renderWeekBar(){
    var el = $("week-bar");
    if (!el) return;
    if (currentType || editing || !LOG.length){
      el.style.display = "none";
      el.innerHTML = "";
      return;
    }
    var t = weekTally(isoOf(startOfWeek(new Date())));
    var daysLeft = 7 - ((new Date().getDay() + 6) % 7); // Monday-anchored, incl. today
    var pips = "";
    for (var i=0;i<WK_LIFT_GOOD;i++){
      pips += '<span class="wb-pip'+(i >= WK_LIFT_MIN ? " bonus" : "")+(t.liftDays > i ? " on" : "")+'"></span>';
    }
    var cpips = "";
    for (var j=0;j<WK_CORE_MIN;j++){
      cpips += '<span class="wb-pip core'+(t.coreDays > j ? " on" : "")+'"></span>';
    }
    var hint;
    if (t.liftDays === 0){
      hint = daysLeft <= 3
        ? "No lifts banked &mdash; " + daysLeft + (daysLeft === 1 ? " day" : " days") + " left. The mission is muscle: lift first."
        : "No lifts banked yet &mdash; Blocks 1, 2, 3 and 6 count.";
    } else if (t.liftDays === 1){
      hint = "One more lift banks the week.";
    } else if (t.liftDays === 2){
      hint = "Strength week banked &#10003; &mdash; a third is even better.";
    } else {
      hint = t.liftDays + " lifts banked. Best kind of week.";
    }
    if (t.coreDays < WK_CORE_MIN){
      hint += " Core &times;" + (WK_CORE_MIN - t.coreDays) + " still owed &mdash; Block 7 stacks on any day, ~13 min.";
    }
    el.style.display = "";
    el.innerHTML =
      '<div class="wb-row"><span class="wb-lbl">Lift</span>' + pips +
      '<span class="wb-lbl wb-core-lbl">Core</span>' + cpips +
      '<span class="wb-left">' + daysLeft + (daysLeft === 1 ? " day" : " days") + ' left</span></div>' +
      '<div class="wb-hint">' + hint + '</div>';
  }

  function renderPicker(){
    renderWeekBar(); // renderPicker fires at every state transition — one choke point
    var host = $("block-picker");
    var label = $("picker-label");
    if (!host) return;
    if (currentType){ // a form is on stage; the picker steps aside
      host.style.display = "none";
      if (label) label.style.display = "none";
      return;
    }
    host.style.display = "";
    if (label) label.style.display = "flex";

    // suggested stack + deload whisper — only while nothing is picked yet
    var suggs = [], dl = false;
    if (!selBlocks.length){
      suggs = suggestStacks($("in-date").value || todayISO());
      dl = deloadDue();
    }
    var h = "";
    if (suggs.length || dl){
      h += '<div class="sugg">';
      if (suggs.length) h += '<div class="sugg-eyebrow">Today &mdash; suggested stack</div>';
      suggs.forEach(function(sg, i){
        h += '<button type="button" class="sugg-row" data-sugg="'+i+'">' +
          '<span class="sugg-main"><span class="sugg-ids">'+sg.ids.join(" + ")+'</span>' +
          '<span class="sugg-names">'+esc(sg.ids.map(function(b){ return PROGRAM.blocks[b].name; }).join(" · "))+'</span></span>' +
          '<span class="sugg-min">&asymp; '+sg.est+' min</span>' +
          '<span class="sugg-why">'+esc(sg.why)+'</span></button>';
      });
      if (dl){
        h += '<div class="sugg-deload"><span>Six-plus weeks without a break &mdash; make this a deload week: same blocks, working sets &minus;40% (3&rarr;2, 2&rarr;1), keep the loads.</span>' +
          '<button type="button" class="pc-btn ghost" id="deload-ok">Got it</button></div>';
      }
      h += '</div>';
    }

    h += '<div class="blocks-grid">';
    BLOCK_ORDER.forEach(function(bid){
      var blk = PROGRAM.blocks[bid];
      var on = selBlocks.indexOf(bid) !== -1;
      var off = !on && !!conflictWith(bid);
      var kindCls = blk.kind === "Strength" ? "k-s" : (blk.kind === "Cardio" ? "k-c" : (blk.kind === "Stability" ? "k-st" : ""));
      h += '<button type="button" class="blk'+(on?" on":"")+(off?" off":"")+(blk.wide?" wide":"")+'" data-blk="'+bid+'" aria-pressed="'+(on?"true":"false")+'">' +
        '<span class="b-no">Block '+bid+'</span>' +
        '<span class="b-name">'+esc(blk.name)+'</span>' +
        '<span class="b-meta"><span class="'+kindCls+'">'+esc(blk.kind)+'</span> &middot; ~'+esc(blk.min)+' min</span>' +
        '</button>';
    });
    h += '</div>';

    var est = estOf(selBlocks);
    var totCls = selBlocks.length ? (est < 60 ? "lo" : (est > 90 ? "hi" : "")) : "lo";
    var hasStrength = selBlocks.some(function(b){ return STRENGTH_BLOCKS[b]; });
    // when the week's mandate is still short, the warning gets personal
    var wkNow = weekTally(isoOf(startOfWeek(new Date())));
    h += '<div class="stack-bar">' +
      '<div class="stack-line"><span>Warm-up 5 &middot; ' +
      (selBlocks.length ? selBlocks.length + ' block' + (selBlocks.length > 1 ? 's' : '') : 'no blocks yet') +
      ' &middot; Cool-down 5</span>' +
      '<span class="stack-total '+totCls+'">&asymp; '+est+' min' + (selBlocks.length ? ' &middot; target 60&ndash;90' : '') + '</span></div>' +
      (selBlocks.length && !hasStrength
        ? '<div class="stack-hint warn">No strength block yet — ' +
          (wkNow.liftDays < WK_LIFT_MIN
            ? 'you\'re at ' + wkNow.liftDays + ' of ' + WK_LIFT_MIN + ' lifts this week. '
            : 'always lift if you can. ') +
          'Short day? Cut cardio, never strength.</div>'
        : '<div class="stack-hint">One strength + one cardio fills a normal day; Block 7 stacks anywhere. Short day? Cut cardio, never strength.</div>') +
      '</div>';

    h += '<div class="stack-actions">' +
      '<button type="button" class="day-btn" id="start-day"'+(selBlocks.length ? '' : ' disabled')+'>Start Session</button>' +
      '<button type="button" class="day-btn ghost" id="free-day">Free</button></div>';

    host.innerHTML = h;

    Array.prototype.forEach.call(host.querySelectorAll(".sugg-row"), function(row){
      row.addEventListener("click", function(){
        var pick = suggs[+row.dataset.sugg];
        if (!pick) return;
        selBlocks = pick.ids.slice(); // pre-select only — every block stays toggleable
        renderPicker();
      });
    });
    var dok = $("deload-ok");
    if (dok) dok.addEventListener("click", function(){
      deloadSet();
      renderPicker();
      toast("Deload noted — lighter week, same movements");
    });

    Array.prototype.forEach.call(host.querySelectorAll(".blk"), function(b){
      b.addEventListener("click", function(){
        var bid = b.dataset.blk;
        var at = selBlocks.indexOf(bid);
        if (at !== -1){
          selBlocks.splice(at, 1);
        } else {
          var cf = conflictWith(bid);
          if (cf){
            toast("Block " + bid + " doesn't stack with Block " + cf + " — they overlap");
            return;
          }
          selBlocks.push(bid);
          selBlocks.sort();
        }
        renderPicker();
      });
    });

    var sd = $("start-day");
    if (sd) sd.addEventListener("click", function(){
      if (!selBlocks.length){ toast("Pick at least one block"); return; }
      // both warnings share ONE arm, evaluated together — two competing arm
      // states on one flag would ping-pong forever and deadlock the button
      var hasS = selBlocks.some(function(b){ return STRENGTH_BLOCKS[b]; });
      var warns = [];
      if (loadDraft()) warns.push("you have an unfinished draft");
      if (!hasS){
        var tlN = weekTally(isoOf(startOfWeek(new Date()))).liftDays;
        warns.push(tlN < WK_LIFT_MIN
          ? "no strength block picked (you're at " + tlN + " of " + WK_LIFT_MIN + " lifts this week)"
          : "no strength block picked");
      }
      if (warns.length && !sd.dataset.armed){
        sd.dataset.armed = "1";
        var msg = warns.join(", and ");
        toast(msg.charAt(0).toUpperCase() + msg.slice(1) + " — tap again to start anyway");
        setTimeout(function(){ delete sd.dataset.armed; }, 3000);
        return;
      }
      delete sd.dataset.armed;
      buildForm("Day"); // the date field above is respected — backdating stays
    });
    var fd = $("free-day");
    if (fd) fd.addEventListener("click", function(){
      if (loadDraft() && !fd.dataset.armed){
        fd.dataset.armed = "1";
        toast("You have an unfinished draft — tap again to start fresh anyway");
        setTimeout(function(){ delete fd.dataset.armed; }, 3000);
        return;
      }
      delete fd.dataset.armed;
      buildForm("Free");
    });
  }

  // ----- Draft autosave (protects against tab eviction / stray taps) -----
  var draftTimer = null;
  var draftOwned = false; // has the CURRENT form written the draft slot?
  function saveDraftSoon(){
    if (!currentType || editing) return;
    clearTimeout(draftTimer);
    draftTimer = setTimeout(function(){
      if (!currentType || editing) return;
      try {
        var s = gather();
        if (!s.date) s.date = todayISO(); // a dateless draft would be unrestorable
        if (hasContent(s)){ localStorage.setItem(DRAFT_KEY, JSON.stringify(s)); draftOwned = true; }
        // only remove a draft this form owns — a contentless stray click on a
        // fresh form must not delete an older stored draft
        else if (draftOwned) localStorage.removeItem(DRAFT_KEY);
      } catch(e){}
    }, 400);
  }
  function loadDraft(){
    try {
      var raw = localStorage.getItem(DRAFT_KEY);
      if (!raw) return null;
      var d = normalizeSession(JSON.parse(raw));
      return (d && hasContent(d)) ? d : null;
    } catch(e){ return null; }
  }
  function clearDraft(){
    clearTimeout(draftTimer);
    draftTimer = null;
    draftOwned = false;
    try { localStorage.removeItem(DRAFT_KEY); } catch(e){}
  }

  // ----- Progression prompt (earned suggestions > draft resume > two-week nudge) -----
  var PKEY = "cole-training-prog";
  function progLast(){ try { return localStorage.getItem(PKEY) || null; } catch(e){ return null; } }
  function progSet(){ try { localStorage.setItem(PKEY, new Date().toISOString()); } catch(e){} }
  function progressionDue(){
    if (!LOG.length) return false;
    var DAY = 86400000, now = Date.now();
    var last = progLast();
    if (last) return (now - new Date(last).getTime()) >= 14*DAY;
    var first = LOG.reduce(function(a,s){
      var t = parseISO(s.date).getTime();
      return t < a ? t : a;
    }, Infinity);
    return (now - first) >= 14*DAY;
  }

  // deload whisper: every ~6 weeks, one lighter week (same blocks, fewer sets).
  // Same pattern as the PKEY nudge; deliberately NOT exported/imported — worst
  // case on a new device the whisper reappears once and gets dismissed once.
  var DKEY = "cole-training-deload";
  function deloadLast(){ try { return localStorage.getItem(DKEY) || null; } catch(e){ return null; } }
  function deloadSet(){ try { localStorage.setItem(DKEY, new Date().toISOString()); } catch(e){} }
  function deloadDue(){
    if (!LOG.length) return false;
    var DAY = 86400000, now = Date.now();
    var last = deloadLast();
    if (last) return (now - new Date(last).getTime()) >= 42*DAY;
    var first = LOG.reduce(function(a,s){
      var t = parseISO(s.date).getTime();
      return t < a ? t : a;
    }, Infinity);
    return (now - first) >= 42*DAY;
  }

  function renderPrompt(){
    var el = $("prog-prompt");
    if (!el) return;
    if (currentType || editing){ el.innerHTML = ""; return; }

    var d = loadDraft();
    if (d){
      el.innerHTML = '<div class="prompt-card"><div class="pc-h">Unfinished session</div>' +
        '<div class="pc-b">A draft from ' + fmtDate(d.date) + ' (' + esc(blocksLabel(d)) + ') was saved as you typed.</div>' +
        '<div class="pc-row"><button class="pc-btn" id="draft-resume">Resume</button>' +
        '<button class="pc-btn ghost" id="draft-discard">Discard</button></div></div>';
      $("draft-resume").addEventListener("click", function(){
        if (d.type === "Day"){
          selBlocks = (d.blocks || []).slice();
          buildForm("Day", d, false);
        } else {
          buildForm(PROGRAM[d.type] ? d.type : "Free", d, false);
        }
      });
      $("draft-discard").addEventListener("click", function(){
        clearDraft();
        renderPrompt();
        renderPicker(); // the suggested stack takes over from the resume card
        toast("Draft discarded");
      });
      return;
    }

    // earned suggestions across every block's strength list (names deduped —
    // shared movements like Leg Curl appear once, whichever block runs them)
    var suggs = [];
    var seenSug = {};
    BLOCK_ORDER.forEach(function(bid){
      (PROGRAM.blocks[bid].strength || []).forEach(function(ex){
        if (seenSug[ex.name]) return;
        seenSug[ex.name] = true;
        var pf = progressionFor(ex); // same brain as the form — reads through low-fuel days
        if (pf.sg && pf.sg.to) suggs.push({ name: ex.name, s: pf.sg, bid: bid });
      });
    });
    if (suggs.length){
      // the suggestions card fulfills the periodic-nudge role; stamp the check-in
      // so it can't resurface months overdue the moment suggestions briefly vanish
      if (progressionDue()) progSet();
      el.innerHTML = '<div class="prompt-card"><div class="pc-h">Progression ready</div>' +
        '<div class="pc-b">Earned last time — these pre-fill whenever their block is in the day\'s stack:</div>' +
        '<div class="pc-list">' + suggs.map(function(x){
          return '<div class="pc-line"><span>'+esc(x.name)+' <span style="color:var(--muted);">&middot; B'+x.bid+'</span></span><span>'+x.s.from+' &rarr; '+x.s.to+' lbs</span></div>';
        }).join("") + '</div></div>';
      return;
    }

    if (progressionDue()){
      el.innerHTML = '<div class="prompt-card"><div class="pc-h">Two-week check-in</div>'+
        '<div class="pc-b">Time for a small nudge. Pick one: add a rep to any lift, bump a weight by the smallest increment, or add 5 seconds to your plank.</div>'+
        '<button class="pc-btn" id="prog-ok">Got it</button></div>';
      var ok = $("prog-ok");
      if (ok) ok.addEventListener("click", function(){ progSet(); renderPrompt(); });
    } else {
      el.innerHTML = "";
    }
  }

  // ----- History rendering -----
  function summarize(s){
    var bits = [];
    if (s.type === "Day" && s.blocks && s.blocks.length) bits.push("B" + s.blocks.join("·"));
    if (s.strength.length){
      bits.push(s.strength.length + " lift" + (s.strength.length>1?"s":""));
    }
    var totMin = s.cardio.reduce(function(a,c){ return a + (c.min||0); }, 0);
    if (totMin) bits.push(totMin + " min cardio");
    else if (s.cardio.length) bits.push("cardio");
    if (s.core.length) bits.push(s.core.length + " core");
    var out = bits.join("  ·  ") || "session";
    if (s.fuel) out += "  ·  low fuel";
    if (s._edited) out += "  ·  amended";
    return out;
  }

  function renderHistory(){
    renderCycle();

    var stats = $("stats");
    var sow = startOfWeek(new Date());
    var thisWeek = LOG.filter(function(s){
      return parseISO(s.date) >= sow;
    }).length;
    var wtNow = weekTally(isoOf(sow));
    stats.innerHTML =
      '<div class="stat"><div class="num">' + thisWeek + '<small> / ' + CYCLE.weeklyGoal + '</small></div><div class="lbl">This Week</div>' +
      '<div class="sub">' + wtNow.liftDays + ' lift' + (wtNow.liftDays === 1 ? '' : 's') + ' &middot; ' + wtNow.coreDays + ' core</div></div>' +
      '<div class="stat"><div class="num">' + LOG.length + '</div><div class="lbl">Total Logged</div></div>';

    var list = $("hist-list");
    var openSet = {};
    Array.prototype.forEach.call(list.querySelectorAll(".h-item.open"), function(it){
      if (it.dataset.t) openSet[it.dataset.t] = true;
    });

    // reset also clears the cycle, goal, and draft — keep it reachable
    // whenever any of those holds non-default state
    var resettable = LOG.length || loadDraft() ||
      (CYCLE && (CYCLE.num !== 1 || CYCLE.weeklyGoal !== 4));
    $("reset-btn").style.display = resettable ? "block" : "none";
    if (!LOG.length){
      list.innerHTML = '<div class="empty"><div class="e-mark">&sect;</div><p>No sessions yet. Your first entry starts the record.</p></div>';
      renderProgress();
      return;
    }

    // which exercises qualify for a Progress row (2+ sessions of data)
    var series = exerciseSeries();
    var qualifies = {};
    series.order.forEach(function(n){
      // must match renderProgress's unit-filtered count, or the link is dead
      if (unitSeries(series.map[n]).pts.length >= 2) qualifies[n] = true;
    });

    var sorted = LOG.slice().sort(function(a,b){
      if (a.date === b.date) return (b._t||0) - (a._t||0);
      return a.date < b.date ? 1 : -1;
    });

    list.innerHTML = "";
    sorted.forEach(function(s){
      var item = document.createElement("div");
      item.className = "h-item";
      item.dataset.t = s._t || "";
      if (openSet[item.dataset.t]) item.classList.add("open");
      var badgeClass = s.type === "Day" ? (isStrengthDay(s) ? "b-A" : "b-B")
        : (s.type === "A" ? "b-A" : (s.type === "B" ? "b-B" : ""));
      var top = document.createElement("div");
      top.className = "h-top";
      top.setAttribute("role","button");
      top.tabIndex = 0;
      top.setAttribute("aria-expanded", item.classList.contains("open") ? "true" : "false");
      top.innerHTML =
        '<div class="h-badge '+badgeClass+'">'+ esc(badgeText(s)) +'</div>' +
        '<div class="h-meta"><div class="h-date">'+ fmtDate(s.date) +'</div>' +
        '<div class="h-sum">'+ summarize(s) +'</div></div>' +
        '<div class="h-chev">&#9660;</div>';
      pressable(top, function(){
        var open = item.classList.toggle("open");
        top.setAttribute("aria-expanded", open ? "true" : "false");
      });
      item.appendChild(top);

      var body = document.createElement("div");
      body.className = "h-body";
      var html = "";

      if (s.type === "Day" && s.blocks && s.blocks.length){
        var bnames = s.blocks.map(function(b){
          return b + " " + (PROGRAM.blocks[b] ? PROGRAM.blocks[b].name : "");
        }).join(" · ");
        html += '<div class="h-section-tag">Blocks — ' + esc(bnames) + '</div>';
      }
      if (s.strength.length){
        html += '<div class="h-section-tag">Strength</div>';
        s.strength.forEach(function(ex){
          var v = ex.sets.map(function(st){
            return (st.weight!=null?esc(st.weight):"-") + "×" + (st.reps!=null?esc(st.reps):"-");
          }).join(", ");
          var nameHtml = qualifies[ex.name]
            ? '<span class="hl-name hl-link" role="button" tabindex="0" data-ex="'+esc(ex.name)+'" title="View progress">'+esc(ex.name)+'</span>'
            : '<span class="hl-name">'+esc(ex.name)+'</span>';
          html += '<div class="h-line">'+ nameHtml +'<span class="hl-val">'+ v +'</span></div>';
        });
      }
      if (s.cardio.length){
        html += '<div class="h-section-tag">Cardio</div>';
        s.cardio.forEach(function(c){
          var parts = [];
          if (c.min!=null) parts.push(esc(c.min) + " min");
          if (c.lvl) parts.push(esc(c.lvl));
          if (c.dist) parts.push(esc(c.dist));
          html += '<div class="h-line"><span class="hl-name">'+ esc(c.act) +'</span><span class="hl-val">'+ parts.join(" &middot; ") +'</span></div>';
        });
      }
      if (s.core.length){
        html += '<div class="h-section-tag">Core</div>';
        html += '<div class="h-line"><span class="hl-name" style="font-size:14px;">'+ s.core.map(esc).join(", ") +'</span></div>';
      }
      if (s.rpe){
        html += '<div class="h-line"><span class="hl-name" style="font-size:14px;color:var(--muted);">Effort</span><span class="hl-val">'+ esc(s.rpe) +'</span></div>';
      }
      var wuN = (s.warmup && s.warmup.length) || 0;
      var cdN = (s.cooldown && s.cooldown.length) || 0;
      if (wuN || cdN){
        html += '<div class="h-line"><span class="hl-name" style="font-size:14px;color:var(--muted);">Warm-up / Cool-down</span><span class="hl-val">'+ wuN +'/'+ PROGRAM.warmup.length +' &middot; '+ cdN +'/'+ PROGRAM.cooldown.length +'</span></div>';
      }
      if (s.knee){
        html += '<div class="h-knee">&#9888; Knee discomfort flagged</div>';
      }
      if (s.fuel){
        html += '<div class="h-fuel">&#9680; Low-fuel day &mdash; capped effort</div>';
      }
      if (s.notes){
        html += '<div class="h-notes">&ldquo;'+ esc(s.notes) +'&rdquo;</div>';
      }
      body.innerHTML = html;

      var actions = document.createElement("div");
      actions.className = "h-actions";

      var ed = document.createElement("button");
      ed.type = "button";
      ed.className = "edit";
      ed.textContent = "Edit this session";
      ed.addEventListener("click", function(){
        // a live form (new entries or another edit) deserves the same two-tap
        // protection the type buttons give before being replaced
        if (formHasEntries() && !ed.classList.contains("armed")){
          ed.classList.add("armed");
          ed.textContent = "Tap again — open entries will be discarded";
          setTimeout(function(){
            ed.classList.remove("armed");
            ed.textContent = "Edit this session";
          }, 4000);
          return;
        }
        ed.classList.remove("armed");
        ed.textContent = "Edit this session";
        startEdit(s);
      });
      actions.appendChild(ed);

      var del = document.createElement("button");
      del.type = "button";
      del.className = "del";
      del.textContent = "Delete this session";
      del.addEventListener("click", function(){
        if (del.classList.contains("armed")){
          var idx = LOG.indexOf(s);
          if (idx > -1) LOG.splice(idx, 1);
          var okDel = Store.save(LOG);
          renderHistory();
          // the undo toast outlives a tab switch — keep the Log tab's week
          // bar, suggestions, and prompt in step with the data either way
          renderPrompt();
          renderPicker();
          toastAction(okDel ? "Session deleted" : "Session deleted (storage unavailable)", function(){
            LOG.push(s);
            var okUndo = Store.save(LOG);
            renderHistory();
            renderPrompt();
            renderPicker();
            toast(okUndo ? "Session restored" : "Restored for this visit only");
          });
        } else {
          del.classList.add("armed");
          del.textContent = "Tap again to confirm";
          setTimeout(function(){
            del.classList.remove("armed");
            del.textContent = "Delete this session";
          }, 4000);
        }
      });
      actions.appendChild(del);

      body.appendChild(actions);
      item.appendChild(body);
      list.appendChild(item);
    });

    renderProgress();
  }

  // ----- Progress ledger -----
  function exerciseSeries(){
    var sorted = LOG.slice().sort(function(a,b){
      if (a.date === b.date) return (a._t||0) - (b._t||0);
      return a.date < b.date ? -1 : 1;
    });
    var map = {};
    var order = [];
    sorted.forEach(function(s){
      (s.strength || []).forEach(function(ex){
        var sets = ex.sets || [];
        var hasW = sets.some(function(st){ return st.weight != null; });
        var vol = 0, top = null;
        sets.forEach(function(st){ vol += (st.weight||0) * (st.reps||0); });
        if (hasW){
          sets.forEach(function(st){
            if (st.weight == null) return;
            if (!top || st.weight > top.w || (st.weight === top.w && (st.reps||0) > (top.r||0))){
              top = { w: st.weight, r: st.reps };
            }
          });
        } else {
          sets.forEach(function(st){
            if (st.reps == null) return;
            if (!top || st.reps > top.w) top = { w: st.reps, r: null };
          });
        }
        if (!top) return;
        if (!map[ex.name]){ map[ex.name] = []; order.push(ex.name); }
        // reps-only movements may really be seconds (Plank) or yards (Farmer Carry)
        map[ex.name].push({ date: s.date, top: top, vol: vol,
          unit: hasW ? "lbs" : (unitForName(ex.name) || "reps") });
      });
    });
    return { map: map, order: order };
  }

  // one exercise's plottable series: pick the dominant unit and keep matching points
  function unitSeries(ptsAll){
    var unit = "lbs";
    if (!ptsAll.some(function(p){ return p.unit === "lbs"; })){
      unit = ptsAll.length ? ptsAll[0].unit : "reps";
    }
    return {
      unit: unit,
      pts: ptsAll.filter(function(p){ return p.unit === unit; }).map(function(p){
        return { v: p.top.w, r: p.top.r, date: p.date, vol: p.vol };
      })
    };
  }

  function sparklineSVG(pts, prIdx){
    var W = 560, H = 64, P = 8;
    var vals = pts.map(function(p){ return p.v; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var span = (max - min) || 1;
    function x(i){ return pts.length > 1 ? P + i * ((W - 2*P) / (pts.length - 1)) : W / 2; }
    function y(v){ return H - P - ((v - min) / span) * (H - 2*P); }
    var poly = pts.map(function(p,i){ return x(i).toFixed(1) + "," + y(p.v).toFixed(1); }).join(" ");
    var svg = '<svg class="spark" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">';
    svg += '<line class="sp-base" x1="'+P+'" y1="'+(H-P)+'" x2="'+(W-P)+'" y2="'+(H-P)+'"/>';
    if (pts.length > 1) svg += '<polyline class="sp-line" points="'+poly+'"/>';
    pts.forEach(function(p,i){
      svg += '<circle class="'+(i===prIdx ? "sp-pt sp-pr" : "sp-pt")+'" cx="'+x(i).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="'+(i===prIdx ? 4 : 2.5)+'"/>';
    });
    svg += '</svg>';
    return svg;
  }

  function renderProgress(){
    var label = $("prog-label"), list = $("prog-list");
    if (!label || !list) return;
    var series = exerciseSeries();
    var progOrder = PROGRAM.A.strength.map(function(e){ return e.name; });
    var names = series.order.slice().sort(function(a,b){
      var ia = progOrder.indexOf(a), ib = progOrder.indexOf(b);
      if (ia !== -1 && ib !== -1) return ia - ib;
      if (ia !== -1) return -1;
      if (ib !== -1) return 1;
      return a < b ? -1 : 1;
    });

    var openEx = {};
    Array.prototype.forEach.call(list.querySelectorAll(".p-item.open"), function(p){
      if (p.dataset.ex) openEx[p.dataset.ex] = true;
    });
    list.innerHTML = "";
    var shown = 0;
    names.forEach(function(name){
      var us = unitSeries(series.map[name]);
      var unit = us.unit, pts = us.pts;
      if (pts.length < 2) return;
      shown++;

      var first = pts[0], lastP = pts[pts.length - 1];
      var delta = lastP.v - first.v;
      var prIdx = 0;
      pts.forEach(function(p,i){ if (p.v >= pts[prIdx].v) prIdx = i; });
      var pr = pts[prIdx];

      var item = document.createElement("div");
      item.className = "h-item p-item";
      item.dataset.ex = name;
      if (openEx[name]) item.classList.add("open");

      var deltaHtml = delta > 0 ? '<span class="p-delta up">+'+delta+' '+unit+'</span>'
        : (delta < 0 ? '<span class="p-delta down">'+delta+' '+unit+'</span>'
        : '<span class="p-delta">&mdash;</span>');
      var latest = unit === "lbs"
        ? lastP.v + ' &times; ' + (lastP.r != null ? lastP.r : "-")
        : lastP.v + ' ' + unit;

      var top = document.createElement("div");
      top.className = "h-top";
      top.setAttribute("role","button");
      top.tabIndex = 0;
      top.setAttribute("aria-expanded", item.classList.contains("open") ? "true" : "false");
      top.innerHTML =
        '<div class="h-meta"><div class="h-date">'+esc(name)+'</div>' +
        '<div class="h-sum">'+pts.length+' sessions logged</div></div>' +
        deltaHtml +
        '<span class="p-latest">'+latest+'</span>' +
        '<div class="h-chev">&#9660;</div>';
      pressable(top, function(){
        var open = item.classList.toggle("open");
        top.setAttribute("aria-expanded", open ? "true" : "false");
      });
      item.appendChild(top);

      var body = document.createElement("div");
      body.className = "h-body";
      var volLine = "";
      if (unit === "lbs" && lastP.vol > 0){
        var pctTxt = "";
        if (first.vol > 0){
          var pct = Math.round((lastP.vol - first.vol) / first.vol * 100);
          pctTxt = " &middot; " + (pct >= 0 ? "+" : "") + pct + "% vs first";
        }
        volLine = '<div class="p-stat">Volume &mdash; ' + lastP.vol.toLocaleString() + ' lbs last session' + pctTxt + '</div>';
      }
      body.innerHTML =
        '<div class="spark-wrap">' + sparklineSVG(pts, prIdx) +
        '<div class="spark-dates"><span>'+fmtDate(first.date)+'</span><span>'+fmtDate(lastP.date)+'</span></div></div>' +
        '<div class="p-stat">Record &mdash; ' + pr.v + ' ' + unit +
        (unit === "lbs" && pr.r != null ? ' &times; ' + pr.r : '') +
        ' &middot; ' + fmtDate(pr.date) + '</div>' + volLine;
      item.appendChild(body);
      list.appendChild(item);
    });

    label.style.display = shown ? "flex" : "none";
  }

  function openProgressRow(name){
    var items = document.querySelectorAll("#prog-list .p-item");
    for (var i=0;i<items.length;i++){
      if (items[i].dataset.ex === name){
        items[i].classList.add("open");
        var top = items[i].querySelector(".h-top");
        if (top) top.setAttribute("aria-expanded","true");
        items[i].scrollIntoView({ behavior:"smooth", block:"center" });
        return;
      }
    }
  }

  // ----- Cycle ledger -----
  function renderCycle(){
    var el = $("cycle-card");
    if (!el || !CYCLE) return;
    var startD = parseISO(CYCLE.start);
    var counts = buildCycleCounts();
    var numLbl = String(CYCLE.num).padStart(2,"0");
    var done = Date.now() >= startD.getTime() + 28 * 86400000;

    if (done){
      var metW = 0;
      counts.weeks.forEach(function(wk){ if (wk.strDays >= WK_LIFT_MIN) metW++; });
      el.innerHTML =
        '<div class="cycle-card complete">' +
        '<div class="cyc-h">Four weeks banked.</div>' +
        '<div class="cyc-b">' + counts.total + ' session' + (counts.total === 1 ? "" : "s") +
        ' over four weeks &middot; strength mandate (2+ lifts/wk) met in ' + metW +
        ' of 4. Carry your numbers into the next cycle.</div>' +
        '<button class="pc-btn" id="cyc-next">Begin Cycle ' + String(CYCLE.num + 1).padStart(2,"0") + '</button></div>';
      $("cyc-next").addEventListener("click", function(){
        CYCLE.num += 1;
        CYCLE.start = isoOf(startOfWeek(new Date()));
        cycleSave();
        updateCycleTag();
        renderHistory();
        toast("Cycle " + String(CYCLE.num).padStart(2,"0") + " begins");
      });
      return;
    }

    var curWeek = Math.min(4, Math.max(1, Math.floor((Date.now() - startD.getTime()) / (7 * 86400000)) + 1));
    var tIso = todayISO();
    var rows = "";
    for (var w = 0; w < 4; w++){
      var cells = "";
      for (var d = 0; d < 7; d++){
        var cellDate = new Date(startD.getTime());
        cellDate.setDate(cellDate.getDate() + w * 7 + d);
        var cIso = isoOf(cellDate);
        var bucket = counts.weeks[w].days[d];
        var cls = "cyc-cell";
        var inner = "";
        if (bucket.count){
          var t = bucket.types[bucket.types.length - 1];
          cls += t === "A" ? " t-A" : (t === "B" ? " t-B" : " t-F");
          if (bucket.count > 1) inner = bucket.count;
        } else if (cIso > tIso){
          cls += " future";
        }
        if (cIso === tIso) cls += " today";
        cells += '<span class="'+cls+'">'+inner+'</span>';
      }
      var met = counts.weeks[w].total >= CYCLE.weeklyGoal;
      // strength mandate: sage when met; red ONLY for a fully elapsed week that
      // missed it — current and future weeks stay neutral (progress, not judgment)
      var wkEnded = startD.getTime() + (w + 1) * 7 * 86400000 <= Date.now();
      var mandCls = counts.weeks[w].strDays >= WK_LIFT_MIN ? " met" : (wkEnded ? " miss" : "");
      rows += '<div class="cyc-row"><span class="cyc-wk">WK '+(w+1)+'</span>' +
        '<span class="cyc-cells">'+cells+'</span>' +
        '<span class="cyc-tally'+(met ? " met" : "")+'">'+(met ? "&#10003; " : "")+counts.weeks[w].total+'/'+CYCLE.weeklyGoal+
        '<span class="cyc-mand'+mandCls+'">S'+counts.weeks[w].strDays+' &middot; C'+counts.weeks[w].coreDays+'</span></span></div>';
    }

    var target = CYCLE.weeklyGoal * 4;
    var pct = Math.min(100, Math.round(counts.total / target * 100));
    el.innerHTML =
      '<div class="cycle-card">' +
        '<div class="cyc-head"><div><div class="cyc-title">Cycle '+numLbl+'</div>' +
        '<div class="cyc-sub">Week '+curWeek+' of 4</div></div>' +
        '<div class="cyc-goal"><button type="button" class="x-btn" id="goal-dn" aria-label="Lower weekly goal">&minus;</button>' +
        '<span class="cyc-goal-lbl">Goal '+CYCLE.weeklyGoal+' / wk</span>' +
        '<button type="button" class="x-btn" id="goal-up" aria-label="Raise weekly goal">+</button></div></div>' +
        rows +
        '<div class="cyc-barwrap"><div class="cyc-bar" style="width:'+pct+'%"></div></div>' +
        '<div class="cyc-cap">'+counts.total+' / '+target+' sessions this cycle</div>' +
      '</div>';
    $("goal-dn").addEventListener("click", function(){
      if (CYCLE.weeklyGoal > 2){ CYCLE.weeklyGoal--; cycleSave(); renderHistory(); }
    });
    $("goal-up").addEventListener("click", function(){
      if (CYCLE.weeklyGoal < 7){ CYCLE.weeklyGoal++; cycleSave(); renderHistory(); }
    });
  }

    $("view-log").classList.toggle("show", isLog);
    $("view-hist").classList.toggle("show", !isLog);
    $("tab-log").classList.toggle("active", isLog);
    $("tab-hist").classList.toggle("active", !isLog);

  // ----- Toast -----
  var toastTimer;
  function resetToast(t){
    t.classList.remove("show","action");
    t.style.pointerEvents = "none";
    t.onclick = null;
  }
  function toast(msg){
    var t = $("toast");
    resetToast(t);
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ resetToast(t); }, 2400);
  }
  function toastAction(msg, fn){
    var t = $("toast");
    resetToast(t);
    t.textContent = msg;
    var b = document.createElement("button");
    b.type = "button";
    b.className = "toast-btn";
    b.textContent = "Undo";
    b.addEventListener("click", function(ev){
      ev.stopPropagation();
      resetToast(t);
      fn();
    });
    t.appendChild(b);
    t.classList.add("show","action");
    t.style.pointerEvents = "auto";
    t.onclick = function(){
      resetToast(t);
      fn();
    };
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ resetToast(t); }, 6000);
  }

  // ----- Rest timer -----
  var REST_SET = 30, REST_EX = 60; // between sets / between exercises
  var restDur = REST_SET, restEndAt = 0, restTimer = null, audioCtx = null;
  function ensureAudio(){
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === "suspended") audioCtx.resume();
    } catch(e){}
  }
  function beep(){
    if (!audioCtx) return;
    try {
      [0, 0.25].forEach(function(off){
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.frequency.value = 880;
        o.connect(g); g.connect(audioCtx.destination);
        var t = audioCtx.currentTime + off;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.2, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
        o.start(t); o.stop(t + 0.18);
      });
    } catch(e){}
  }
  function startRest(dur, label){
    ensureAudio(); // inside the tap gesture so iOS allows the later beep
    restDur = dur || REST_SET; // +30s extensions apply to one rest only
    restEndAt = Date.now() + restDur * 1000;
    var chip = $("rest-chip");
    var lbl = chip.querySelector(".rc-label");
    if (lbl) lbl.textContent = label || "REST";
    chip.classList.remove("over");
    chip.style.display = "flex";
    clearInterval(restTimer);
    restTimer = setInterval(tickRest, 250);
    tickRest();
  }
  function tickRest(){
    if (!restEndAt) return;
    var left = restEndAt - Date.now();
    if (left <= 0){ finishRest(); return; }
    var s = Math.ceil(left / 1000);
    $("rc-time").textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2,"0");
    $("rc-bar").style.width = Math.max(0, Math.min(100, left / (restDur * 1000) * 100)) + "%";
  }
  function finishRest(){
    clearInterval(restTimer);
    restTimer = null;
    restEndAt = 0;
    var chip = $("rest-chip");
    chip.classList.add("over");
    $("rc-time").textContent = "OVER — GO";
    $("rc-bar").style.width = "0%";
    if (navigator.vibrate){ try { navigator.vibrate([200,100,200]); } catch(e){} }
    beep();
    // don't let the GO state expire invisibly while the tab is backgrounded
    setTimeout(function(){ if (!restEndAt && !document.hidden) chip.style.display = "none"; }, 4000);
  }
  function stopRest(){
    clearInterval(restTimer);
    restTimer = null;
    restEndAt = 0;
    var chip = $("rest-chip");
    if (chip) chip.style.display = "none";
  }

  // ----- Backup: export / import -----
  var APPID = "training-log";
  function download(name, text){
    var blob = new Blob([text], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
  }
  function exportData(){
    var d = new Date();
    var payload = { app:APPID, version:2, exportedAt:d.toISOString(), cycle:CYCLE, sessions:LOG };
    download("training-log-backup-"+isoOf(d)+".json", JSON.stringify(payload, null, 2));
    toast(LOG.length ? ("Exported "+LOG.length+" session"+(LOG.length>1?"s":"")) : "Exported an empty backup");
  }
  function pickImport(){
    var inp = document.createElement("input");
    inp.type = "file"; inp.accept = "application/json,.json";
    inp.addEventListener("change", function(){ if (inp.files && inp.files[0]) importData(inp.files[0]); });
    inp.click();
  }
  function contentKey(s){
    return s.date + "|" + s.type + "|" + JSON.stringify(s.blocks || []) + "|" +
      JSON.stringify(s.strength) + "|" + JSON.stringify(s.cardio) +
      "|" + JSON.stringify(s.core) + "|" + JSON.stringify(s.warmup) + "|" + JSON.stringify(s.cooldown) +
      "|" + s.rpe + "|" + (s.knee ? 1 : 0) + "|" + (s.fuel ? 1 : 0) + "|" + s.notes;
  }
  function importData(file){
    var reader = new FileReader();
    reader.onload = function(){
      var data;
      try { data = JSON.parse(reader.result); } catch(e){ toast("Couldn't read that file"); return; }
      if (data && data.app && data.app !== APPID){ toast("That backup is from a different tracker"); return; }
      var arr = Array.isArray(data) ? data : (data && data.sessions);
      if (!Array.isArray(arr)){ toast("No sessions found in that file"); return; }

      var byT = {}, seenKey = {};
      LOG.forEach(function(s, i){
        if (s._t) byT[s._t] = i;
        seenKey[contentKey(s)] = true;
      });
      var added = 0, updated = 0, skippedBad = 0;
      arr.forEach(function(raw){
        var s = normalizeSession(raw);
        if (!s){ skippedBad++; return; }
        if (s._t && byT[s._t] != null){
          // same identity: adopt the backup's copy only when it is a NEWER edit
          var cur = LOG[byT[s._t]];
          if ((s._edited||0) > (cur._edited||0)){ LOG[byT[s._t]] = s; updated++; }
          return;
        }
        var k = contentKey(s);
        if (seenKey[k]) return;
        if (!s._t) s._t = freshT();
        LOG.push(s);
        byT[s._t] = LOG.length - 1;
        seenKey[k] = true;
        added++;
      });
      // adopt the backup's cycle only when it is AHEAD of the local one — restoring
      // an old backup must not rewind the current cycle number, anchor, or goal
      if (data && validCycle(data.cycle) && (!validCycle(CYCLE) || data.cycle.num > CYCLE.num)){
        CYCLE = {
          start: isoOf(startOfWeek(parseISO(data.cycle.start))), // grid math assumes a Monday anchor
          num: data.cycle.num,
          weeklyGoal: data.cycle.weeklyGoal
        };
        cycleSave();
        updateCycleTag();
      }
      var okImp = Store.save(LOG);
      renderHistory();
      var msg = added ? ("Imported " + added + " session" + (added > 1 ? "s" : "")) : (updated ? "" : "Already up to date");
      if (updated) msg += (msg ? " · " : "") + "updated " + updated;
      if (!msg) msg = "Already up to date";
      if (skippedBad) msg += " · skipped " + skippedBad + " malformed";
      if ((added || updated) && !okImp) msg += " — saved for this visit only";
      toast(msg);
    };
    reader.readAsText(file);
  }

  // ----- Init -----
  function init(){
    LOG = Store.load();
    // seed the timestamp generator so new _t values can't collide with imports
    LOG.forEach(function(s){ if (s._t && s._t > lastT) lastT = s._t; });
    ensureCycle();
    updateCycleTag();
    $("loading").style.display = "none";
    $("in-date").value = todayISO();

    $("tab-log").addEventListener("click", function(){ switchView("log"); });
    $("tab-hist").addEventListener("click", function(){ switchView("hist"); });

    $("save-btn").addEventListener("click", saveSession);

    // draft autosave: one delegated pair of listeners survives form rebuilds
    var fa = $("form-area");
    fa.addEventListener("input", saveDraftSoon);
    fa.addEventListener("click", saveDraftSoon);
    $("in-date").addEventListener("change", saveDraftSoon);
    // backdating recomputes the suggested stack for that date's week
    $("in-date").addEventListener("change", function(){
      if (!currentType && !editing) renderPicker();
    });

    // tap an exercise name in a session to jump to its progress row
    $("hist-list").addEventListener("click", function(e){
      var t = e.target.closest ? e.target.closest(".hl-link") : null;
      if (t && t.dataset.ex) openProgressRow(t.dataset.ex);
    });
    $("hist-list").addEventListener("keydown", function(e){
      if (e.key !== "Enter" && e.key !== " ") return;
      var t = e.target.closest ? e.target.closest(".hl-link") : null;
      if (t && t.dataset.ex){ e.preventDefault(); openProgressRow(t.dataset.ex); }
    });

    // rest chip wiring
    var chip = $("rest-chip");
    chip.addEventListener("click", function(){ stopRest(); });
    $("rc-add").addEventListener("click", function(e){
      e.stopPropagation();
      if (restEndAt){ restEndAt += 30000; restDur += 30; tickRest(); }
    });
    $("rc-skip").addEventListener("click", function(e){
      e.stopPropagation();
      stopRest();
    });
    document.addEventListener("visibilitychange", function(){
      if (document.hidden) return;
      if (restEndAt){ tickRest(); return; }
      // the rest finished while backgrounded: show GO now, then hide
      var chip = $("rest-chip");
      if (chip.classList.contains("over") && chip.style.display !== "none"){
        setTimeout(function(){ if (!restEndAt) chip.style.display = "none"; }, 4000);
      }
    });
    // multi-tab safety: when another tab writes the store, refresh this one's view
    // while idle instead of later clobbering it with a stale snapshot
    window.addEventListener("storage", function(e){
      if (e.key === KEY && !currentType && !editing){
        LOG = Store.load();
        LOG.forEach(function(s){ if (s._t && s._t > lastT) lastT = s._t; });
        ensureCycle();
        updateCycleTag();
        renderHistory();
        renderPrompt();
        renderPicker(); // week bar + suggestions follow the fresh data
      }
    });

    var exB = $("export-btn"); if (exB) exB.addEventListener("click", exportData);
    var imB = $("import-btn"); if (imB) imB.addEventListener("click", pickImport);

    var resetBtn = $("reset-btn");
    resetBtn.addEventListener("click", function(){
      if (resetBtn.classList.contains("armed")){
        var hadSessions = LOG.length > 0;
        if (hadSessions) exportData(); // a backup lands in Downloads before anything is destroyed
        // belt and braces: downloads can fail silently (notably iOS standalone),
        // so stash the erased data in storage as a recovery copy too
        if (hadSessions){ try { localStorage.setItem(KEY + "-erased", JSON.stringify(LOG)); } catch(e){} }
        LOG = [];
        Store.save(LOG);
        try { localStorage.removeItem(PKEY); } catch(e){}
        try { localStorage.removeItem(DKEY); } catch(e){}
        clearDraft();
        CYCLE = { start: isoOf(startOfWeek(new Date())), num: 1, weeklyGoal: 4 };
        cycleSave();
        updateCycleTag();
        renderHistory();
        resetBtn.classList.remove("armed");
        resetBtn.textContent = "Erase all records";
        toast(hadSessions ? "Records erased — backup downloaded" : "Records erased");
      } else {
        resetBtn.classList.add("armed");
        resetBtn.textContent = "Tap again to erase everything";
        setTimeout(function(){
          resetBtn.classList.remove("armed");
          resetBtn.textContent = "Erase all records";
        }, 4000);
      }
    });

    renderPrompt();
    renderHistory();
    switchView("log");
  }

  init();
})();
</script>
</body>
</html>
