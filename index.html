  // ----- History rendering -----
  function summarize(s){
    var bits = [];
    if (s.strength.length){
      bits.push(s.strength.length + " lift" + (s.strength.length>1?"s":""));
    }
    var totMin = s.cardio.reduce(function(a,c){ return a + (c.min||0); }, 0);
    if (totMin) bits.push(totMin + " min cardio");
    else if (s.cardio.length) bits.push("cardio");
    if (s.core.length) bits.push(s.core.length + " core");
    var out = bits.join("  ·  ") || "session";
    if (s._edited) out += "  ·  amended";
    return out;
  }

  function renderHistory(){
    renderCycle();

    var stats = $("stats");
    var sow = startOfWeek(new Date());
    var thisWeek = LOG.filter(function(s){
      return parseISO(s.date) >= sow;
    }).length;
    stats.innerHTML =
      '<div class="stat"><div class="num">' + thisWeek + '<small> / ' + CYCLE.weeklyGoal + '</small></div><div class="lbl">This Week</div></div>' +
      '<div class="stat"><div class="num">' + LOG.length + '</div><div class="lbl">Total Logged</div></div>';

    var list = $("hist-list");
    var openSet = {};
    Array.prototype.forEach.call(list.querySelectorAll(".h-item.open"), function(it){
      if (it.dataset.t) openSet[it.dataset.t] = true;
    });

    // reset also clears the cycle, goal, and draft — keep it reachable
    // whenever any of those holds non-default state
    var resettable = LOG.length || loadDraft() ||
      (CYCLE && (CYCLE.num !== 1 || CYCLE.weeklyGoal !== 4));
    $("reset-btn").style.display = resettable ? "block" : "none";
    if (!LOG.length){
      list.innerHTML = '<div class="empty"><div class="e-mark">&sect;</div><p>No sessions yet. Your first entry starts the record.</p></div>';
      renderProgress();
      return;
    }

    // which exercises qualify for a Progress row (2+ sessions of data)
    var series = exerciseSeries();
    var qualifies = {};
    series.order.forEach(function(n){
      // must match renderProgress's unit-filtered count, or the link is dead
      if (unitSeries(series.map[n]).pts.length >= 2) qualifies[n] = true;
    });

    var sorted = LOG.slice().sort(function(a,b){
      if (a.date === b.date) return (b._t||0) - (a._t||0);
      return a.date < b.date ? 1 : -1;
    });

    list.innerHTML = "";
    sorted.forEach(function(s){
      var item = document.createElement("div");
      item.className = "h-item";
      item.dataset.t = s._t || "";
      if (openSet[item.dataset.t]) item.classList.add("open");
      var badgeClass = s.type === "A" ? "b-A" : (s.type === "B" ? "b-B" : "");
      var top = document.createElement("div");
      top.className = "h-top";
      top.setAttribute("role","button");
      top.tabIndex = 0;
      top.setAttribute("aria-expanded", item.classList.contains("open") ? "true" : "false");
      top.innerHTML =
        '<div class="h-badge '+badgeClass+'">'+ esc(s.type) +'</div>' +
        '<div class="h-meta"><div class="h-date">'+ fmtDate(s.date) +'</div>' +
        '<div class="h-sum">'+ summarize(s) +'</div></div>' +
        '<div class="h-chev">&#9660;</div>';
      pressable(top, function(){
        var open = item.classList.toggle("open");
        top.setAttribute("aria-expanded", open ? "true" : "false");
      });
      item.appendChild(top);

      var body = document.createElement("div");
      body.className = "h-body";
      var html = "";

      if (s.strength.length){
        html += '<div class="h-section-tag">Strength</div>';
        s.strength.forEach(function(ex){
          var v = ex.sets.map(function(st){
            return (st.weight!=null?esc(st.weight):"-") + "×" + (st.reps!=null?esc(st.reps):"-");
          }).join(", ");
          var nameHtml = qualifies[ex.name]
            ? '<span class="hl-name hl-link" role="button" tabindex="0" data-ex="'+esc(ex.name)+'" title="View progress">'+esc(ex.name)+'</span>'
            : '<span class="hl-name">'+esc(ex.name)+'</span>';
          html += '<div class="h-line">'+ nameHtml +'<span class="hl-val">'+ v +'</span></div>';
        });
      }
      if (s.cardio.length){
        html += '<div class="h-section-tag">Cardio</div>';
        s.cardio.forEach(function(c){
          var parts = [];
          if (c.min!=null) parts.push(esc(c.min) + " min");
          if (c.lvl) parts.push(esc(c.lvl));
          if (c.dist) parts.push(esc(c.dist));
          html += '<div class="h-line"><span class="hl-name">'+ esc(c.act) +'</span><span class="hl-val">'+ parts.join(" &middot; ") +'</span></div>';
        });
      }
      if (s.core.length){
        html += '<div class="h-section-tag">Core</div>';
        html += '<div class="h-line"><span class="hl-name" style="font-size:14px;">'+ s.core.map(esc).join(", ") +'</span></div>';
      }
      if (s.rpe){
        html += '<div class="h-line"><span class="hl-name" style="font-size:14px;color:var(--muted);">Effort</span><span class="hl-val">'+ esc(s.rpe) +'</span></div>';
      }
      var wuN = (s.warmup && s.warmup.length) || 0;
      var cdN = (s.cooldown && s.cooldown.length) || 0;
      if (wuN || cdN){
        html += '<div class="h-line"><span class="hl-name" style="font-size:14px;color:var(--muted);">Warm-up / Cool-down</span><span class="hl-val">'+ wuN +'/'+ PROGRAM.warmup.length +' &middot; '+ cdN +'/'+ PROGRAM.cooldown.length +'</span></div>';
      }
      if (s.knee){
        html += '<div class="h-knee">&#9888; Knee discomfort flagged</div>';
      }
      if (s.notes){
        html += '<div class="h-notes">&ldquo;'+ esc(s.notes) +'&rdquo;</div>';
      }
      body.innerHTML = html;

      var actions = document.createElement("div");
      actions.className = "h-actions";

      var ed = document.createElement("button");
      ed.type = "button";
      ed.className = "edit";
      ed.textContent = "Edit this session";
      ed.addEventListener("click", function(){
        // a live form (new entries or another edit) deserves the same two-tap
        // protection the type buttons give before being replaced
        if (formHasEntries() && !ed.classList.contains("armed")){
          ed.classList.add("armed");
          ed.textContent = "Tap again — open entries will be discarded";
          setTimeout(function(){
            ed.classList.remove("armed");
            ed.textContent = "Edit this session";
          }, 4000);
          return;
        }
        ed.classList.remove("armed");
        ed.textContent = "Edit this session";
        startEdit(s);
      });
      actions.appendChild(ed);

      var del = document.createElement("button");
      del.type = "button";
      del.className = "del";
      del.textContent = "Delete this session";
      del.addEventListener("click", function(){
        if (del.classList.contains("armed")){
          var idx = LOG.indexOf(s);
          if (idx > -1) LOG.splice(idx, 1);
          var okDel = Store.save(LOG);
          renderHistory();
          toastAction(okDel ? "Session deleted" : "Session deleted (storage unavailable)", function(){
            LOG.push(s);
            var okUndo = Store.save(LOG);
            renderHistory();
            toast(okUndo ? "Session restored" : "Restored for this visit only");
          });
        } else {
          del.classList.add("armed");
          del.textContent = "Tap again to confirm";
          setTimeout(function(){
            del.classList.remove("armed");
            del.textContent = "Delete this session";
          }, 4000);
        }
      });
      actions.appendChild(del);

      body.appendChild(actions);
      item.appendChild(body);
      list.appendChild(item);
    });

    renderProgress();
  }

  // ----- Progress ledger -----
  function exerciseSeries(){
    var sorted = LOG.slice().sort(function(a,b){
      if (a.date === b.date) return (a._t||0) - (b._t||0);
      return a.date < b.date ? -1 : 1;
    });
    var map = {};
    var order = [];
    sorted.forEach(function(s){
      (s.strength || []).forEach(function(ex){
        var sets = ex.sets || [];
        var hasW = sets.some(function(st){ return st.weight != null; });
        var vol = 0, top = null;
        sets.forEach(function(st){ vol += (st.weight||0) * (st.reps||0); });
        if (hasW){
          sets.forEach(function(st){
            if (st.weight == null) return;
            if (!top || st.weight > top.w || (st.weight === top.w && (st.reps||0) > (top.r||0))){
              top = { w: st.weight, r: st.reps };
            }
          });
        } else {
          sets.forEach(function(st){
            if (st.reps == null) return;
            if (!top || st.reps > top.w) top = { w: st.reps, r: null };
          });
        }
        if (!top) return;
        if (!map[ex.name]){ map[ex.name] = []; order.push(ex.name); }
        map[ex.name].push({ date: s.date, top: top, vol: vol, unit: hasW ? "lbs" : "reps" });
      });
    });
    return { map: map, order: order };
  }

  // one exercise's plottable series: pick the dominant unit and keep matching points
  function unitSeries(ptsAll){
    var unit = ptsAll.some(function(p){ return p.unit === "lbs"; }) ? "lbs" : "reps";
    return {
      unit: unit,
      pts: ptsAll.filter(function(p){ return p.unit === unit; }).map(function(p){
        return { v: p.top.w, r: p.top.r, date: p.date, vol: p.vol };
      })
    };
  }

  function sparklineSVG(pts, prIdx){
    var W = 560, H = 64, P = 8;
    var vals = pts.map(function(p){ return p.v; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var span = (max - min) || 1;
    function x(i){ return pts.length > 1 ? P + i * ((W - 2*P) / (pts.length - 1)) : W / 2; }
    function y(v){ return H - P - ((v - min) / span) * (H - 2*P); }
    var poly = pts.map(function(p,i){ return x(i).toFixed(1) + "," + y(p.v).toFixed(1); }).join(" ");
    var svg = '<svg class="spark" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">';
    svg += '<line class="sp-base" x1="'+P+'" y1="'+(H-P)+'" x2="'+(W-P)+'" y2="'+(H-P)+'"/>';
    if (pts.length > 1) svg += '<polyline class="sp-line" points="'+poly+'"/>';
    pts.forEach(function(p,i){
      svg += '<circle class="'+(i===prIdx ? "sp-pt sp-pr" : "sp-pt")+'" cx="'+x(i).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="'+(i===prIdx ? 4 : 2.5)+'"/>';
    });
    svg += '</svg>';
    return svg;
  }

  function renderProgress(){
    var label = $("prog-label"), list = $("prog-list");
    if (!label || !list) return;
    var series = exerciseSeries();
    var progOrder = PROGRAM.A.strength.map(function(e){ return e.name; });
    var names = series.order.slice().sort(function(a,b){
      var ia = progOrder.indexOf(a), ib = progOrder.indexOf(b);
      if (ia !== -1 && ib !== -1) return ia - ib;
      if (ia !== -1) return -1;
      if (ib !== -1) return 1;
      return a < b ? -1 : 1;
    });

    var openEx = {};
    Array.prototype.forEach.call(list.querySelectorAll(".p-item.open"), function(p){
      if (p.dataset.ex) openEx[p.dataset.ex] = true;
    });
    list.innerHTML = "";
    var shown = 0;
    names.forEach(function(name){
      var us = unitSeries(series.map[name]);
      var unit = us.unit, pts = us.pts;
      if (pts.length < 2) return;
      shown++;

      var first = pts[0], lastP = pts[pts.length - 1];
      var delta = lastP.v - first.v;
      var prIdx = 0;
      pts.forEach(function(p,i){ if (p.v >= pts[prIdx].v) prIdx = i; });
      var pr = pts[prIdx];

      var item = document.createElement("div");
      item.className = "h-item p-item";
      item.dataset.ex = name;
      if (openEx[name]) item.classList.add("open");

      var deltaHtml = delta > 0 ? '<span class="p-delta up">+'+delta+' '+unit+'</span>'
        : (delta < 0 ? '<span class="p-delta down">'+delta+' '+unit+'</span>'
        : '<span class="p-delta">&mdash;</span>');
      var latest = unit === "lbs"
        ? lastP.v + ' &times; ' + (lastP.r != null ? lastP.r : "-")
        : lastP.v + ' reps';

      var top = document.createElement("div");
      top.className = "h-top";
      top.setAttribute("role","button");
      top.tabIndex = 0;
      top.setAttribute("aria-expanded", item.classList.contains("open") ? "true" : "false");
      top.innerHTML =
        '<div class="h-meta"><div class="h-date">'+esc(name)+'</div>' +
        '<div class="h-sum">'+pts.length+' sessions logged</div></div>' +
        deltaHtml +
        '<span class="p-latest">'+latest+'</span>' +
        '<div class="h-chev">&#9660;</div>';
      pressable(top, function(){
        var open = item.classList.toggle("open");
        top.setAttribute("aria-expanded", open ? "true" : "false");
      });
      item.appendChild(top);

      var body = document.createElement("div");
      body.className = "h-body";
      var volLine = "";
      if (unit === "lbs" && lastP.vol > 0){
        var pctTxt = "";
        if (first.vol > 0){
          var pct = Math.round((lastP.vol - first.vol) / first.vol * 100);
          pctTxt = " &middot; " + (pct >= 0 ? "+" : "") + pct + "% vs first";
        }
        volLine = '<div class="p-stat">Volume &mdash; ' + lastP.vol.toLocaleString() + ' lbs last session' + pctTxt + '</div>';
      }
      body.innerHTML =
        '<div class="spark-wrap">' + sparklineSVG(pts, prIdx) +
        '<div class="spark-dates"><span>'+fmtDate(first.date)+'</span><span>'+fmtDate(lastP.date)+'</span></div></div>' +
        '<div class="p-stat">Record &mdash; ' + pr.v + ' ' + unit +
        (unit === "lbs" && pr.r != null ? ' &times; ' + pr.r : '') +
        ' &middot; ' + fmtDate(pr.date) + '</div>' + volLine;
      item.appendChild(body);
      list.appendChild(item);
    });

    label.style.display = shown ? "flex" : "none";
  }

  function openProgressRow(name){
    var items = document.querySelectorAll("#prog-list .p-item");
    for (var i=0;i<items.length;i++){
      if (items[i].dataset.ex === name){
        items[i].classList.add("open");
        var top = items[i].querySelector(".h-top");
        if (top) top.setAttribute("aria-expanded","true");
        items[i].scrollIntoView({ behavior:"smooth", block:"center" });
        return;
      }
    }
  }

  // ----- Cycle ledger -----
  function renderCycle(){
    var el = $("cycle-card");
    if (!el || !CYCLE) return;
    var startD = parseISO(CYCLE.start);
    var counts = buildCycleCounts();
    var numLbl = String(CYCLE.num).padStart(2,"0");
    var done = Date.now() >= startD.getTime() + 28 * 86400000;

    if (done){
      el.innerHTML =
        '<div class="cycle-card complete">' +
        '<div class="cyc-h">Foundation laid.</div>' +
        '<div class="cyc-b">' + counts.total + ' session' + (counts.total === 1 ? "" : "s") +
        ' over four weeks. Carry your numbers into the next cycle.</div>' +
        '<button class="pc-btn" id="cyc-next">Begin Cycle ' + String(CYCLE.num + 1).padStart(2,"0") + '</button></div>';
      $("cyc-next").addEventListener("click", function(){
        CYCLE.num += 1;
        CYCLE.start = isoOf(startOfWeek(new Date()));
        cycleSave();
        updateCycleTag();
        renderHistory();
        toast("Cycle " + String(CYCLE.num).padStart(2,"0") + " begins");
      });
      return;
    }

    var curWeek = Math.min(4, Math.max(1, Math.floor((Date.now() - startD.getTime()) / (7 * 86400000)) + 1));
    var tIso = todayISO();
    var rows = "";
    for (var w = 0; w < 4; w++){
      var cells = "";
      for (var d = 0; d < 7; d++){
        var cellDate = new Date(startD.getTime());
        cellDate.setDate(cellDate.getDate() + w * 7 + d);
        var cIso = isoOf(cellDate);
        var bucket = counts.weeks[w].days[d];
        var cls = "cyc-cell";
        var inner = "";
        if (bucket.count){
          var t = bucket.types[bucket.types.length - 1];
          cls += t === "A" ? " t-A" : (t === "B" ? " t-B" : " t-F");
          if (bucket.count > 1) inner = bucket.count;
        } else if (cIso > tIso){
          cls += " future";
        }
        if (cIso === tIso) cls += " today";
        cells += '<span class="'+cls+'">'+inner+'</span>';
      }
      var met = counts.weeks[w].total >= CYCLE.weeklyGoal;
      rows += '<div class="cyc-row"><span class="cyc-wk">WK '+(w+1)+'</span>' +
        '<span class="cyc-cells">'+cells+'</span>' +
        '<span class="cyc-tally'+(met ? " met" : "")+'">'+(met ? "&#10003; " : "")+counts.weeks[w].total+'/'+CYCLE.weeklyGoal+'</span></div>';
    }

    var target = CYCLE.weeklyGoal * 4;
    var pct = Math.min(100, Math.round(counts.total / target * 100));
    el.innerHTML =
      '<div class="cycle-card">' +
        '<div class="cyc-head"><div><div class="cyc-title">Cycle '+numLbl+'</div>' +
        '<div class="cyc-sub">Week '+curWeek+' of 4</div></div>' +
        '<div class="cyc-goal"><button type="button" class="x-btn" id="goal-dn" aria-label="Lower weekly goal">&minus;</button>' +
        '<span class="cyc-goal-lbl">Goal '+CYCLE.weeklyGoal+' / wk</span>' +
        '<button type="button" class="x-btn" id="goal-up" aria-label="Raise weekly goal">+</button></div></div>' +
        rows +
        '<div class="cyc-barwrap"><div class="cyc-bar" style="width:'+pct+'%"></div></div>' +
        '<div class="cyc-cap">'+counts.total+' / '+target+' sessions this cycle</div>' +
      '</div>';
    $("goal-dn").addEventListener("click", function(){
      if (CYCLE.weeklyGoal > 2){ CYCLE.weeklyGoal--; cycleSave(); renderHistory(); }
    });
    $("goal-up").addEventListener("click", function(){
      if (CYCLE.weeklyGoal < 7){ CYCLE.weeklyGoal++; cycleSave(); renderHistory(); }
    });
  }

  // ----- View switching -----
  function switchView(which){
    var isLog = which === "log";
    $("view-log").classList.toggle("show", isLog);
    $("view-hist").classList.toggle("show", !isLog);
    $("tab-log").classList.toggle("active", isLog);

  // ----- Toast -----
  var toastTimer;
  function resetToast(t){
    t.classList.remove("show","action");
    t.style.pointerEvents = "none";
    t.onclick = null;
  }
  function toast(msg){
    var t = $("toast");
    resetToast(t);
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ resetToast(t); }, 2400);
  }
  function toastAction(msg, fn){
    var t = $("toast");
    resetToast(t);
    t.textContent = msg;
    var b = document.createElement("button");
    b.type = "button";
    b.className = "toast-btn";
    b.textContent = "Undo";
    b.addEventListener("click", function(ev){
      ev.stopPropagation();
      resetToast(t);
      fn();
    });
    t.appendChild(b);
    t.classList.add("show","action");
    t.style.pointerEvents = "auto";
    t.onclick = function(){
      resetToast(t);
      fn();
    };
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ resetToast(t); }, 6000);
  }

  // ----- Rest timer -----
  var REST_DEFAULT = 90;
  var restDur = REST_DEFAULT, restEndAt = 0, restTimer = null, audioCtx = null;
  function ensureAudio(){
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === "suspended") audioCtx.resume();
    } catch(e){}
  }
  function beep(){
    if (!audioCtx) return;
    try {
      [0, 0.25].forEach(function(off){
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.frequency.value = 880;
        o.connect(g); g.connect(audioCtx.destination);
        var t = audioCtx.currentTime + off;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.2, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
        o.start(t); o.stop(t + 0.18);
      });
    } catch(e){}
  }
  function startRest(){
    ensureAudio(); // inside the tap gesture so iOS allows the later beep
    restDur = REST_DEFAULT; // +30s extensions apply to one rest only
    restEndAt = Date.now() + restDur * 1000;
    var chip = $("rest-chip");
    chip.classList.remove("over");
    chip.style.display = "flex";
    clearInterval(restTimer);
    restTimer = setInterval(tickRest, 250);
    tickRest();
  }
  function tickRest(){
    if (!restEndAt) return;
    var left = restEndAt - Date.now();
    if (left <= 0){ finishRest(); return; }
    var s = Math.ceil(left / 1000);
    $("rc-time").textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2,"0");
    $("rc-bar").style.width = Math.max(0, Math.min(100, left / (restDur * 1000) * 100)) + "%";
  }
  function finishRest(){
    clearInterval(restTimer);
    restTimer = null;
    restEndAt = 0;
    var chip = $("rest-chip");
    chip.classList.add("over");
    $("rc-time").textContent = "OVER — GO";
    $("rc-bar").style.width = "0%";
    if (navigator.vibrate){ try { navigator.vibrate([200,100,200]); } catch(e){} }
    beep();
    setTimeout(function(){ if (!restEndAt) chip.style.display = "none"; }, 4000);
  }
  function stopRest(){
    clearInterval(restTimer);
    restTimer = null;
    restEndAt = 0;
    var chip = $("rest-chip");
    if (chip) chip.style.display = "none";
  }

  // ----- Backup: export / import -----
  var APPID = "training-log";
  function download(name, text){
    var blob = new Blob([text], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
  }
  function exportData(){
    var d = new Date();
    var payload = { app:APPID, version:2, exportedAt:d.toISOString(), cycle:CYCLE, sessions:LOG };
    download("training-log-backup-"+isoOf(d)+".json", JSON.stringify(payload, null, 2));
    toast(LOG.length ? ("Exported "+LOG.length+" session"+(LOG.length>1?"s":"")) : "Exported an empty backup");
  }
  function pickImport(){
    var inp = document.createElement("input");
    inp.type = "file"; inp.accept = "application/json,.json";
    inp.addEventListener("change", function(){ if (inp.files && inp.files[0]) importData(inp.files[0]); });
    inp.click();
  }
  function contentKey(s){
    return s.date + "|" + s.type + "|" + JSON.stringify(s.strength) + "|" + JSON.stringify(s.cardio) +
      "|" + JSON.stringify(s.core) + "|" + JSON.stringify(s.warmup) + "|" + JSON.stringify(s.cooldown) +
      "|" + s.rpe + "|" + (s.knee ? 1 : 0) + "|" + s.notes;
  }
  function importData(file){
    var reader = new FileReader();
    reader.onload = function(){
      var data;
      try { data = JSON.parse(reader.result); } catch(e){ toast("Couldn't read that file"); return; }
      if (data && data.app && data.app !== APPID){ toast("That backup is from a different tracker"); return; }
      var arr = Array.isArray(data) ? data : (data && data.sessions);
      if (!Array.isArray(arr)){ toast("No sessions found in that file"); return; }

      var seenT = {}, seenKey = {};
      LOG.forEach(function(s){
        if (s._t) seenT[s._t] = true;
        seenKey[contentKey(s)] = true;
      });
      var added = 0, skippedBad = 0;
      arr.forEach(function(raw){
        var s = normalizeSession(raw);
        if (!s){ skippedBad++; return; }
        if (s._t && seenT[s._t]) return;
        var k = contentKey(s);
        if (seenKey[k]) return;
        if (!s._t) s._t = freshT();
        LOG.push(s);
        seenT[s._t] = true;
        seenKey[k] = true;
        added++;
      });
      if (data && validCycle(data.cycle)){
        // grid math assumes a Monday anchor — snap foreign starts to one
        CYCLE = {
          start: isoOf(startOfWeek(parseISO(data.cycle.start))),
          num: data.cycle.num,
          weeklyGoal: data.cycle.weeklyGoal
        };
        cycleSave();
        updateCycleTag();
      }
      var okImp = Store.save(LOG);
      renderHistory();
      var msg = added ? ("Imported " + added + " session" + (added > 1 ? "s" : "")) : "Already up to date";
      if (skippedBad) msg += " · skipped " + skippedBad + " malformed";
      if (added && !okImp) msg += " — saved for this visit only";
      toast(msg);
    };
    reader.readAsText(file);
  }

  // ----- Init -----
  function init(){
    LOG = Store.load();
    // seed the timestamp generator so new _t values can't collide with imports
    LOG.forEach(function(s){ if (s._t && s._t > lastT) lastT = s._t; });
    ensureCycle();
    updateCycleTag();
    $("loading").style.display = "none";
    $("in-date").value = todayISO();

    $("tab-log").addEventListener("click", function(){ switchView("log"); });
    $("tab-hist").addEventListener("click", function(){ switchView("hist"); });

    Array.prototype.forEach.call(document.querySelectorAll(".types button"), function(b){
      b.setAttribute("aria-pressed","false");
      b.addEventListener("click", function(){
        // re-tapping the active type is a no-op (except in edit mode, where it
        // means "abandon this edit and start fresh" and must be confirmed)
        if (!editing && b.dataset.type === currentType) return;
        // anything worth keeping on screen (edit changes or typed entries)
        // requires a confirming second tap before it's discarded
        if ((editing || (currentType && formHasEntries())) && !b.dataset.armed){
          b.dataset.armed = "1";
          toast(editing ? "Tap again to discard this edit and start fresh"
                        : "Tap again to switch — current entries will be discarded");
          setTimeout(function(){ delete b.dataset.armed; }, 3000);
          return;
        }
        delete b.dataset.armed;
        var hadForm = !!currentType;
        var wasEditing = !!editing;
        editing = null;
        stopRest();
        // only clear a draft when the user confirmed replacing a live (non-edit)
        // form; a cold tap must not destroy a stored draft behind the resume card
        if (hadForm && !wasEditing) clearDraft();
        clearTypeButtons();
        b.classList.add("active");
        b.setAttribute("aria-pressed","true");
        $("in-date").value = todayISO();
        buildForm(b.dataset.type);
        b.scrollIntoView({behavior:"smooth", block:"nearest"});
      });
    });

    $("save-btn").addEventListener("click", saveSession);

    // draft autosave: one delegated pair of listeners survives form rebuilds
    var fa = $("form-area");
    fa.addEventListener("input", saveDraftSoon);
    fa.addEventListener("click", saveDraftSoon);
    $("in-date").addEventListener("change", saveDraftSoon);

    // tap an exercise name in a session to jump to its progress row
    $("hist-list").addEventListener("click", function(e){
      var t = e.target.closest ? e.target.closest(".hl-link") : null;
      if (t && t.dataset.ex) openProgressRow(t.dataset.ex);
    });
    $("hist-list").addEventListener("keydown", function(e){
      if (e.key !== "Enter" && e.key !== " ") return;
      var t = e.target.closest ? e.target.closest(".hl-link") : null;
      if (t && t.dataset.ex){ e.preventDefault(); openProgressRow(t.dataset.ex); }
    });

    // rest chip wiring
    var chip = $("rest-chip");
    chip.addEventListener("click", function(){ stopRest(); });
    $("rc-add").addEventListener("click", function(e){
      e.stopPropagation();
      if (restEndAt){ restEndAt += 30000; restDur += 30; tickRest(); }
    });
    $("rc-skip").addEventListener("click", function(e){
      e.stopPropagation();
      stopRest();
    });
    document.addEventListener("visibilitychange", function(){
      if (!document.hidden && restEndAt) tickRest();
    });

    var exB = $("export-btn"); if (exB) exB.addEventListener("click", exportData);
    var imB = $("import-btn"); if (imB) imB.addEventListener("click", pickImport);

    var resetBtn = $("reset-btn");
    resetBtn.addEventListener("click", function(){
      if (resetBtn.classList.contains("armed")){
        var hadSessions = LOG.length > 0;
        if (hadSessions) exportData(); // a backup lands in Downloads before anything is destroyed
        LOG = [];
        Store.save(LOG);
        try { localStorage.removeItem(PKEY); } catch(e){}
        clearDraft();
        CYCLE = { start: isoOf(startOfWeek(new Date())), num: 1, weeklyGoal: 4 };
        cycleSave();
        updateCycleTag();
        renderHistory();
        resetBtn.classList.remove("armed");
        resetBtn.textContent = "Erase all records";
        toast(hadSessions ? "Records erased — backup downloaded" : "Records erased");
      } else {
        resetBtn.classList.add("armed");
        resetBtn.textContent = "Tap again to erase everything";
        setTimeout(function(){
          resetBtn.classList.remove("armed");
          resetBtn.textContent = "Erase all records";
        }, 4000);
      }
    });

    renderPrompt();
    renderHistory();
    switchView("log");
  }

  init();
})();
</script>
</body>
</html>
